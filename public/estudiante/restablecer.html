<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restablecer contraseña - FOEST</title><link rel="stylesheet" href="/estudiante/stylesestudiante.css"><style>
.password-wrap{position:relative!important;display:block!important;width:100%!important}
.password-wrap input{display:block!important;width:100%!important;box-sizing:border-box!important;padding-right:48px!important}
.panel .password-eye,.password-eye{
 position:absolute!important;right:8px!important;top:50%!important;transform:translateY(-50%)!important;
 display:flex!important;align-items:center!important;justify-content:center!important;
 width:36px!important;height:36px!important;min-width:36px!important;
 margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;
 background:transparent!important;color:#475569!important;box-shadow:none!important;cursor:pointer!important;z-index:20!important
}
.panel .password-eye:hover,.password-eye:hover{background:#e2e8f0!important;color:#202224!important}
.password-eye svg{width:21px!important;height:21px!important;display:block!important;pointer-events:none!important}
</style></head><body>
<header><div class="brand"><img src="/images/tocancipa.jpg" alt="Alcaldía de Tocancipá" style="height:80px;object-fit:contain"></div></header>
<main style="max-width:450px;margin:50px auto"><section class="panel"><h2>Nueva contraseña</h2><p class="muted">Crea una nueva contraseña para tu cuenta FOEST.</p><form id="f"><label>Nueva contraseña<span class="password-wrap"><input type="password" id="p1" minlength="8" required><button type="button" class="password-eye" data-password-target="p1" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none!important"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.1 3.2"/><path d="M6.6 6.6C3.5 8.6 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4-.8"/></svg></button></span></label><label>Confirmar contraseña<span class="password-wrap"><input type="password" id="p2" minlength="8" required><button type="button" class="password-eye" data-password-target="p2" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none!important"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.1 3.2"/><path d="M6.6 6.6C3.5 8.6 2 12 2 12s3.5 8 10 8a9.8 9.8 0 0 0 4-.8"/></svg></button></span></label><div id="m"></div><button style="width:100%;margin-top:20px">Guardar nueva contraseña</button></form></section></main>
<script>
const params=new URLSearchParams(location.hash.slice(1));const token=params.get("access_token");
function mensaje(t,ok=false){m.textContent=t;m.style.color=ok?"#15803d":"#b91c1c"}
if(!token)mensaje("El enlace no es válido o ya venció.");
f.addEventListener("submit",async e=>{e.preventDefault();if(!token)return mensaje("El enlace no es válido o ya venció.");if(p1.value!==p2.value)return mensaje("Las contraseñas no coinciden.");const r=await fetch("/api/auth/actualizar-password",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({nuevoPassword:p1.value})});const d=await r.json();if(!r.ok)return mensaje(d.error||"No fue posible actualizar la contraseña.");mensaje("Contraseña actualizada. Redirigiendo al inicio de sesión...",true);setTimeout(()=>location.href="/estudiante/login.html",1500)});
</script><script>
document.querySelectorAll("[data-password-target]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const input=document.getElementById(btn.dataset.passwordTarget);
    if(!input)return;
    const mostrar=input.type==="password";
    input.type=mostrar?"text":"password";
    const open=btn.querySelector(".eye-open"), off=btn.querySelector(".eye-off");
    if(open) open.style.setProperty("display",mostrar?"none":"block","important");
    if(off) off.style.setProperty("display",mostrar?"block":"none","important");
    btn.setAttribute("aria-label",mostrar?"Ocultar contraseña":"Mostrar contraseña");
    btn.title=mostrar?"Ocultar contraseña":"Mostrar contraseña";
  });
});
</script></body></html>
